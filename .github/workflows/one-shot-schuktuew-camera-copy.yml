name: Final Schuktuew camera copy patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-schuktuew-camera-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted copy patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/renderer/src/templates/advanced/camera-explode-scroll.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ["{ id: 'output', label: 'Assets', text: 'Fertige Formate für Website, Social, Kampagne, Recruiting und Print.', offsetX: 135, offsetY: 140, offsetZ: 130 },", "{ id: 'output', label: 'Ausgabe', text: 'Fertige Bilder und Filme für Website, Social Media, Kampagne, Recruiting und Print.', offsetX: 135, offsetY: 140, offsetZ: 130 },"],
            ["  const oldLabels = /gehäuse|gehaeuse|objektiv|verschluss|sensor|monitor|dateien|haltung|perspektive|moment|look|output/.test(labels);", "  const currentSchuktuewHeadline = /gute bilder beginnen lange vor dem auslösen/.test(headline);\n  const oldLabels = /gehäuse|gehaeuse|objektiv|verschluss|sensor|monitor|dateien|haltung|perspektive|moment|look|output|assets/.test(labels);"],
            ["  return oldHeadline && oldLabels && oldCta;", "  return (oldHeadline || currentSchuktuewHeadline) && oldLabels && oldCta;"]
          ];
          for (const [from, to] of replacements) {
            if (!source.includes(from)) throw new Error(`Expected source fragment missing: ${from}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Commit final source state
        shell: bash
        run: |
          git config user.name "Flamingo Automation"
          git config user.email "automation@flamingomedia.online"
          git rm .github/workflows/one-shot-schuktuew-camera-copy.yml
          git add apps/renderer/src/templates/advanced/camera-explode-scroll.tsx
          git commit -m "finish Schuktuew editorial camera copy"
          git push origin HEAD:main
