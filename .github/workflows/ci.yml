name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup@v4 reads the version from the root package.json
      # 'packageManager' field. Supplying an explicit 'version:' conflicts with
      # that and broke our builds; omitting it is the documented fix.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm audit:credentials

      # Guard the section-color contracts: fails if a template was edited
      # without regenerating apps/renderer/src/lib/section-color-contracts-generated.ts
      # (see docs/section-color-system.md).
      - run: pnpm check:section-colors
      - run: pnpm check:tokens
      - run: pnpm audit:crosstalk
      - run: pnpm check:hardcoded-colors

      # Guard the admin editor field surface: fails if a template's data reads
      # changed without regenerating section-editor-field-defaults.ts
      # (npm run sync:section-surface).
      - run: pnpm check:section-surface

      # Unit tests (node:test via tsx — runs on the CI Node version, no build).
      - run: pnpm test

      # Section Lab is the visual contract for every registered section. A
      # static build catches broken stories, preview data and renderer imports.
      - run: pnpm build-storybook

      - run: pnpm --filter @flamingo/admin build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ci-placeholder

      - run: pnpm --filter @flamingo/renderer build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: pnpm --filter @flamingo/marketing build
